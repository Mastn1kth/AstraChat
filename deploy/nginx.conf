server {
  listen 80;
  server_name onda.gory-staff.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name onda.gory-staff.ru;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 120m;

  # Horizontal scaling: `app` is a Docker Compose service name, and with
  # `docker compose up --scale app=N` Docker's embedded DNS resolver
  # (127.0.0.11 inside the compose network) returns one A record per running
  # replica for that same name. Using a `resolver` + variable in `proxy_pass`
  # (instead of a bare `http://app:3001` in each location block) forces
  # nginx to re-resolve periodically rather than caching the first resolved
  # IP for the life of the worker process, so new/removed replicas are
  # picked up without an nginx reload. `valid=10s` bounds how stale that
  # picture can get.
  #
  # No IP-hash / sticky sessions here on purpose: this app fans out
  # WebSocket messages, presence and session state through Redis
  # (server/redis.js, server/limiters.js) rather than in-process memory, so
  # any replica can serve any client — a client can be load-balanced to a
  # different app container between (or even during) requests without
  # losing messages, presence, or auth state. See docs/production.md
  # "Horizontal scaling".
  #
  # If you'd rather avoid the resolver + variable indirection (e.g. a fixed
  # non-Docker-DNS environment), a simpler fallback is a static upstream
  # listing one `server` line per known backend IP/port instead:
  #
  #   upstream app_backend {
  #     server 10.0.0.11:3001;
  #     server 10.0.0.12:3001;
  #     server 10.0.0.13:3001;
  #   }
  resolver 127.0.0.11 valid=10s;

  location /ws {
    set $app_upstream app:3001;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    set $app_upstream app:3001;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
