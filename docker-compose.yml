services:
  # Horizontal scaling: this is a plain `docker compose` file (no swarm-mode
  # `deploy:` keys), so replicas are created with the `--scale` flag, not
  # `deploy.replicas` (that key only takes effect under `docker stack deploy`
  # / swarm mode and is silently ignored by plain `docker compose up`).
  #
  # The single-replica default below keeps the documented
  # `docker compose --env-file .env.production up --build` flow working
  # as-is (direct host port 3001). To run multiple replicas, the fixed
  # `ports: "3001:3001"` mapping must be dropped first (two containers can't
  # both bind host port 3001) and traffic routed through the `nginx` edge
  # profile instead, which load-balances across every replica via Docker's
  # embedded DNS (see deploy/nginx.conf). The simplest way to do that without
  # editing this file is a small override, e.g. `docker-compose.scale.yml`:
  #
  #   services:
  #     app:
  #       ports: []
  #
  #   docker compose --env-file .env.production --profile edge \
  #     -f docker-compose.yml -f docker-compose.scale.yml \
  #     up --build --scale app=3
  #
  # Redis is a hard requirement for multi-replica correctness: WS pub/sub,
  # presence, session cache and rate limiting all live in Redis
  # (server/redis.js, server/limiters.js), not in in-process memory, so any
  # replica can serve any client — no sticky sessions needed. See
  # docs/production.md "Horizontal scaling" for the full explanation and the
  # PostgreSQL caveat (a managed/shared Postgres instance is required; PGlite
  # must never run in more than one replica).
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrachat -d astrachat"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  turn:
    image: coturn/coturn:4.6.3-alpine
    restart: unless-stopped
    profiles: ["turn"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM:-onda.local}
      - --user=${TURN_USERNAME:-onda-turn}:${TURN_PASSWORD:-change-me}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  minio-data:
